<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Lite — AI Sign Language Communication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
  /* Apply saved theme, sign language and motion before first paint. Defaults: light, ASL, system motion setting. */
  (function(){
    var t = 'light';
    try { t = localStorage.getItem('bridge-lite-theme') || 'light'; } catch(e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    var lang = 'asl';
    try { lang = localStorage.getItem('bridge-lite-lang') || 'asl'; } catch(e) {}
    document.documentElement.setAttribute('data-lang', lang === 'psl' ? 'psl' : 'asl');
    var m = null;
    try { m = localStorage.getItem('bridge-lite-motion'); } catch(e) {}
    if(!m) m = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'reduced' : 'full';
    document.documentElement.setAttribute('data-motion', m === 'reduced' ? 'reduced' : 'full');
  })();
</script>
<style>
  /* ---------- Dark (default) ---------- */
  :root, :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#000010;
    --bg-rgb:0,0,16;
    --bg-panel:#0b2a80;
    --bg-panel-rgb:11,42,128;
    --warm-text:#5ad8f5;
    --text-strong:#ffffff;
    --alert-text:#ff9aa5;
    --bg-panel-2:#1a3d9a;
    --signal:#85e0ff;
    --signal-dim:rgba(133,224,255,0.35);
    --warm:#0094c6;
    --warm-dim:rgba(0,148,198,0.30);
    --alert:#ff5a6e;
    --alert-dim:rgba(255,90,110,0.35);
    --text:#baddf2;
    --text-muted:#85e0ff;
    --border:rgba(186,221,242,0.32);
    --btn-border:#85e0ff;
    --card-shadow:0 0 22px rgba(133,224,255,0.14), 0 0 5px rgba(133,224,255,0.08), 0 14px 36px rgba(0,0,0,0.55);
    --card-glow-hover:0 0 32px rgba(133,224,255,0.28), 0 0 8px rgba(133,224,255,0.14), 0 14px 36px rgba(0,0,0,0.55);
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Sora',sans-serif;
    --font-mono:'Space Grotesk',sans-serif;
  }

  /* ---------- Light ---------- */
  :root[data-theme="light"]{
    color-scheme: light;
    --bg-panel-rgb:186,221,242;
    --warm-text:#00607f;
    --text-strong:#000022;
    --alert-text:#a3111f;
    --bg:#eef7fc;
    --bg-rgb:238,247,252;
    --bg-panel:#baddf2;
    --bg-panel-2:#85e0ff;
    --signal:#000022;
    --signal-dim:rgba(0,0,34,0.30);
    --warm:#0094c6;
    --warm-dim:rgba(0,148,198,0.25);
    --alert:#d7263d;
    --alert-dim:rgba(215,38,61,0.25);
    --text:#000022;
    --text-muted:#001242;
    --border:rgba(0,18,66,0.35);
    --btn-border:#001242;
    --card-shadow:0 12px 30px rgba(0,18,66,0.18), 0 2px 6px rgba(0,18,66,0.10);
    --card-glow-hover:0 16px 40px rgba(0,18,66,0.24), 0 0 26px rgba(0,148,198,0.30), 0 2px 6px rgba(0,18,66,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  /* Shadow behind every card panel */
  .bento-card, .pipe-step, .mode-card, .stat-card, .card, .stagger-card, .member, .chart-card{box-shadow:var(--card-shadow);}
  .bento-card:hover, .pipe-step:hover, .mode-card:hover, .stat-card:hover, .card:hover, .stagger-card:hover, .member:hover, .chart-card:hover{box-shadow:var(--card-glow-hover);}
  html[data-motion="reduced"] .bento-card:hover, html[data-motion="reduced"] .pipe-step:hover, html[data-motion="reduced"] .mode-card:hover, html[data-motion="reduced"] .stat-card:hover, html[data-motion="reduced"] .card:hover, html[data-motion="reduced"] .stagger-card:hover, html[data-motion="reduced"] .member:hover, html[data-motion="reduced"] .chart-card:hover{box-shadow:var(--card-shadow);}
  [hidden]{display:none !important;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;cursor:auto;transition:background-color .4s ease,color .4s ease;}
  @media (pointer:coarse){body{cursor:auto;}}
  a{color:inherit;}
  ::selection{background:var(--signal-dim);color:var(--text);}
  :focus-visible{outline:2px solid var(--signal);outline-offset:4px;}

  #cursor-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;}
  @media (pointer:coarse){#cursor-canvas{display:none;}}

  section{position:relative;padding:0 6vw;}
  .eyebrow{font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--signal);margin-bottom:22px;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--signal);}

  /* ---------- Animated background (site palette only) ---------- */
  .wave-bg{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:var(--wave-opacity,0.12);
    background:linear-gradient(-45deg, var(--bg-panel-2), var(--bg), var(--signal), var(--bg-panel-2));
    background-size:400% 400%;animation:wave-shift 15s ease infinite;}
  :root[data-theme="light"]{--wave-opacity:0.2;}
  @keyframes wave-shift{0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}}
  @media (prefers-reduced-motion: reduce){.wave-bg{animation:none;}}

  /* Subtle starfield behind the hero only. Colors come from the theme, so it fits both modes. */
  .hero-stars{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:var(--stars-opacity,0.55);}
  :root[data-theme="light"]{--stars-opacity:1;}
  :root[data-theme="light"] .hero-stars .stars-1{opacity:0.6;}
  :root[data-theme="light"] .hero-stars .stars-2{opacity:0.5;}
  :root[data-theme="light"] .hero-stars .stars-3{opacity:0.4;}
  .hero-stars .stars{position:absolute;inset:0;background-repeat:repeat;}
  .hero-stars .stars-1{background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, var(--text), transparent),
      radial-gradient(1.5px 1.5px at 40px 70px, var(--text), transparent),
      radial-gradient(1.5px 1.5px at 50px 160px, var(--text), transparent),
      radial-gradient(1.5px 1.5px at 90px 40px, var(--text), transparent),
      radial-gradient(1.5px 1.5px at 130px 80px, var(--text), transparent),
      radial-gradient(1.5px 1.5px at 160px 120px, var(--text), transparent);
    background-size:200px 200px;opacity:0.35;animation:hero-stars-move 60s linear infinite;}
  .hero-stars .stars-2{background-image:
      radial-gradient(1px 1px at 25px 50px, var(--signal), transparent),
      radial-gradient(1px 1px at 60px 120px, var(--signal), transparent),
      radial-gradient(1px 1px at 100px 20px, var(--signal), transparent),
      radial-gradient(1px 1px at 140px 90px, var(--signal), transparent);
    background-size:200px 200px;opacity:0.25;animation:hero-stars-move 100s linear infinite;}
  .hero-stars .stars-3{background-image:
      radial-gradient(1px 1px at 35px 90px, var(--text), transparent),
      radial-gradient(1px 1px at 80px 30px, var(--text), transparent),
      radial-gradient(1px 1px at 120px 150px, var(--text), transparent);
    background-size:200px 200px;opacity:0.15;animation:hero-stars-move 150s linear infinite;}
  @keyframes hero-stars-move{from{transform:translateY(0);} to{transform:translateY(-200px);}}
  @media (prefers-reduced-motion: reduce){.hero-stars .stars{animation:none;}}

  /* ---------- Reduced motion (user setting) ----------
     Turns off CSS animations and transitions, hides the moving backgrounds and cursor trail,
     and shows content in its final state. JS handles the GSAP scroll and reveal animations. */
  html[data-motion="reduced"] *,
  html[data-motion="reduced"] *::before,
  html[data-motion="reduced"] *::after{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  html[data-motion="reduced"] .wave-bg,
  html[data-motion="reduced"] .hero-stars,
  html[data-motion="reduced"] #cursor-canvas{display:none !important;}
  html[data-motion="reduced"] .word-inner{transform:none !important;}
  html[data-motion="reduced"] .hero-sub,
  html[data-motion="reduced"] .bento-card,
  html[data-motion="reduced"] .about-note{opacity:1 !important;transform:none !important;}
  html[data-motion="reduced"] .pipe-step{transform:none !important;opacity:1 !important;}
  html[data-motion="reduced"] .pipe-line{width:100% !important;}
  html[data-motion="reduced"] .mode-card{transform:none !important;opacity:1 !important;}
  html[data-motion="reduced"] body{cursor:auto;}
  /* Mouse screens: hide the system pointer so only the site cursor shows */
  @media (hover:hover) and (pointer:fine){
    html[data-motion="full"], html[data-motion="full"] *, html[data-motion="full"] *::before, html[data-motion="full"] *::after{cursor:none !important;}
  }

  /* ---------- Scroll reveals (all pages) ----------
     Items start hidden only when full motion is on. Reduced motion never hides them. */
  html[data-motion="full"] .reveal{opacity:0;}

  /* ---------- Accessibility button (floating, bottom right) ----------
     Layout from the supplied FAB code; colors and icons come from this site's theme. */
  .fab-container{position:fixed;right:24px;bottom:24px;width:60px;height:60px;z-index:150;}
  .fab-main{width:60px;height:60px;border-radius:50%;background:var(--bg-panel-2);color:var(--text);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 20px var(--signal-dim);transition:transform .3s ease, box-shadow .3s ease;position:relative;z-index:2;}
  .fab-main.open{transform:rotate(45deg);}
  @media (hover:hover) and (pointer:fine){ .fab-container:not(.dismissed):hover .fab-main{transform:rotate(45deg);} }
  .fab-main svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .fab-option{position:absolute;width:45px;height:45px;border-radius:50%;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);display:grid;place-items:center;padding:0;cursor:pointer;opacity:0;pointer-events:none;transition:all 0.3s ease;bottom:8px;left:8px;}
  .fab-option svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .fab-option:hover, .fab-option:focus-visible{border-color:var(--signal);color:var(--signal);}
  .fab-option[aria-pressed="true"]{border-color:var(--signal);color:var(--signal);}
  .fab-option .icon-sun{display:none;}
  .fab-option .icon-moon{display:block;}
  :root[data-theme="light"] .fab-option .icon-sun{display:block;}
  :root[data-theme="light"] .fab-option .icon-moon{display:none;}
  .fab-container.open .fab-option{opacity:1;pointer-events:auto;}
  @media (hover:hover) and (pointer:fine){ .fab-container:not(.dismissed):hover .fab-option{opacity:1;pointer-events:auto;} }
  .fab-container.open .fab-1{transform:translateY(-70px);}
  @media (hover:hover) and (pointer:fine){ .fab-container:not(.dismissed):hover .fab-1{transform:translateY(-70px);} }
  .fab-container.open .fab-3{transform:translateX(-70px);}
  @media (hover:hover) and (pointer:fine){ .fab-container:not(.dismissed):hover .fab-3{transform:translateX(-70px);} }

  /* ---------- Sign language toggle (ASL / PSL) ---------- */
  .lang-toggle{display:inline-flex;align-items:center;padding:3px;background:var(--bg-panel);border:1px solid var(--border);border-radius:999px;}
  .lang-option{font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);background:transparent;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;transition:background-color .3s, color .3s;}
  .lang-option:hover{color:var(--signal);}
  .lang-option[aria-checked="true"]{background:var(--signal);color:var(--bg);}
  .lang-option:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .lang-psl{display:none;}
  [data-lang="psl"] .lang-asl{display:none;}
  [data-lang="psl"] .lang-psl{display:inline;}

  /* ---------- Header ---------- */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 6vw;
    background:linear-gradient(to bottom, rgba(var(--bg-rgb),0.92) 0%, rgba(var(--bg-rgb),0.75) 60%, rgba(var(--bg-rgb),0) 100%);
    backdrop-filter:blur(6px);
    border-bottom:1px solid transparent;
    transition:background .3s ease, border-color .3s ease;
  }
  nav.scrolled{background:rgba(var(--bg-rgb),0.94);border-bottom-color:var(--border);backdrop-filter:blur(10px);}
  .nav-logo{font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:0.02em;display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo-badge{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--bg-panel);border:1px solid var(--border);flex-shrink:0;}
  .logo-mark{width:19px;height:27px;color:var(--signal);overflow:visible;}
  .logo-mark use{color:var(--signal);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  /* Desktop: links sit centred in the header, separated by bars */
  @media (min-width:1100px){
    .nav-right{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);gap:0;}
    .nav-right .nav-link{padding:10px 20px;}
  }
  .nav-link{position:relative;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;color:var(--text-muted);text-decoration:none;text-transform:uppercase;padding:9px 16px;transition:color .3s;}
  .nav-link:hover, .nav-link[aria-current="page"]{color:var(--signal);}
  /* Vertical bar between neighbouring links */
  .nav-link + .nav-link::before{content:"";position:absolute;left:0;top:50%;width:1px;height:14px;transform:translateY(-50%);background:var(--border);}

  .theme-toggle{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:999px;
    padding:5px;color:var(--text-muted);
    font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.08em;text-transform:uppercase;
    cursor:pointer;transition:border-color .3s, color .3s;
  }
  @media (pointer:coarse){.theme-toggle{cursor:pointer;}}
  .theme-toggle:hover{border-color:var(--signal);color:var(--signal);}
  .theme-toggle .track{position:relative;width:46px;height:26px;border-radius:999px;background:var(--bg-panel-2);border:none;flex-shrink:0;}
  .theme-toggle .thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal-dim);display:grid;place-items:center;transition:transform .35s cubic-bezier(.4,0,.2,1);}
  .theme-toggle .thumb svg{width:12px;height:12px;stroke:var(--bg);fill:none;stroke-width:2;stroke-linecap:round;}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle .icon-moon{display:block;}
  :root[data-theme="light"] .theme-toggle .thumb{transform:translateX(20px);}
  :root[data-theme="light"] .theme-toggle .icon-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .icon-moon{display:none;}

  .menu-btn{display:none;width:42px;height:42px;border-radius:50%;background:var(--bg-panel);border:1px solid var(--border);cursor:pointer;place-items:center;}
  .menu-btn svg{width:18px;height:18px;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;fill:none;}
  .menu-btn .i-close{display:none;}
  .menu-btn[aria-expanded="true"] .i-open{display:none;}
  .menu-btn[aria-expanded="true"] .i-close{display:block;}
  .mobile-menu{display:none;position:fixed;top:80px;left:5vw;right:5vw;z-index:99;background:var(--bg-panel);border:1px solid var(--border);border-radius:18px;padding:10px;flex-direction:column;gap:4px;box-shadow:0 20px 40px rgba(0,0,0,0.25);}
  .mobile-menu.open{display:flex;}
  .mobile-menu a{font-family:var(--font-mono);font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;padding:14px 16px;border-radius:12px;}
  .mobile-menu a:hover, .mobile-menu a[aria-current="page"]{background:var(--bg-panel-2);color:var(--signal);}

  /* ---------- Home view ---------- */
  #hero{min-height:auto;display:flex;flex-direction:column;justify-content:flex-start;padding-top:170px;padding-bottom:80px;position:relative;overflow:hidden;isolation:isolate;}
  #hero-skeleton{position:absolute;right:-8vw;top:20%;transform:translateY(-50%);width:min(46vw,540px);opacity:0.16;pointer-events:none;z-index:2;}
  #skeleton-lines{stroke:var(--signal);stroke-width:2;stroke-linecap:round;}
  #skeleton-dots{fill:var(--signal);}
  :root[data-theme="light"] #hero-skeleton{opacity:0.22;}

  h1.title{font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,8vw,6.4rem);line-height:1.02;letter-spacing:-0.02em;max-width:14ch;}
  .word-mask{display:inline-block;overflow:hidden;vertical-align:top;}
  .word-inner{display:inline-block;transform:translateY(112%);}
  .accent-mask .word-inner{color:var(--signal);}

  .hero-sub{font-family:var(--font-body);font-weight:400;color:var(--text-muted);font-size:clamp(1rem,1.6vw,1.3rem);max-width:34ch;margin-top:26px;line-height:1.5;opacity:0;}

  .hero-cta{margin-top:36px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;}
  .glow-btn{position:relative;padding:14px 28px;font-family:var(--font-display);font-size:0.95rem;font-weight:600;letter-spacing:0.01em;color:var(--text);background:var(--bg);border:1px solid var(--btn-border);border-radius:12px;cursor:pointer;overflow:hidden;z-index:1;}
  .glow-btn::before{content:'';position:absolute;inset:-2px;background:linear-gradient(45deg,var(--signal),var(--warm),var(--signal),var(--warm));background-size:400%;border-radius:14px;z-index:-2;opacity:0;transition:opacity 0.3s;animation:glow-rotate 3s linear infinite;}
  .glow-btn::after{content:'';position:absolute;inset:2px;background:var(--bg-panel);border-radius:10px;z-index:-1;}
  .glow-btn:hover::before, .glow-btn:focus-visible::before{opacity:1;}
  .glow-btn:focus-visible{outline:none;}
  @keyframes glow-rotate{0%{background-position:0% 50%;} 100%{background-position:400% 50%;}}
  .hero-cta .launch-status{margin-top:0;}
  .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:60px;max-width:900px;}
  .bento-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:22px 20px;opacity:0;transform:translateY(24px);transition:border-color .3s, transform .3s, background-color .4s;}
  .bento-card:hover{border-color:var(--signal-dim);transform:translateY(-3px);}
  .bento-card .num{font-family:var(--font-display);font-weight:700;font-size:2rem;color:var(--signal);}
  .bento-card .label{font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-top:6px;display:block;}
  .bento-card:nth-child(5){grid-column:span 4;}
  .bento-card:nth-child(5) .num{color:var(--warm-text);font-size:1.3rem;}

  .marquee-wrap{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px 0;margin-top:56px;}
  .marquee-track{display:flex;gap:0;white-space:nowrap;width:max-content;animation:marquee 24s linear infinite;font-family:var(--font-mono);font-size:0.78rem;letter-spacing:0.08em;color:var(--text-muted);}
  .marquee-track .dot{color:var(--signal);}
  .marquee-track > *{margin-right:16px;}
  @keyframes marquee{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  #how-it-works{padding-top:90px;padding-bottom:40px;}
  .section-head{max-width:640px;margin-bottom:70px;}
  .section-head h2{font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,4vw,3rem);letter-spacing:-0.01em;margin-top:14px;}
  .section-head h2 .word-mask{overflow:hidden;display:inline-block;}
  .section-head h2 .word-inner{display:inline-block;transform:translateY(112%);}
  .section-head p{color:var(--text-muted);font-weight:400;font-size:1.05rem;line-height:1.65;margin-top:20px;max-width:56ch;}

  .pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 0;max-width:1100px;}
  .pipe-step{position:relative;background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;transition:border-color .3s ease, background-color .3s ease;}
  .pipeline:hover .pipe-step:nth-child(1){transition-delay:0s;}
  .pipeline:hover .pipe-step:nth-child(2){transition-delay:0.1s;}
  .pipeline:hover .pipe-step:nth-child(3){transition-delay:0.2s;}
  .pipeline:hover .pipe-step:nth-child(4){transition-delay:0.3s;}
  @media (max-width:900px){.pipeline{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.pipeline{grid-template-columns:1fr;}}
  .pipe-step .n{font-family:var(--font-mono);font-size:0.7rem;color:var(--signal);letter-spacing:0.08em;}
  .pipe-step h3{color:var(--text-strong);font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin-top:12px;}
  .pipe-step p{color:var(--text-muted);font-size:0.9rem;line-height:1.5;margin-top:10px;}
  .pipe-line{position:absolute;top:-1px;left:0;height:1px;width:0%;background:var(--signal);box-shadow:0 0 8px var(--signal);}

  .about-note{margin-top:60px;padding:24px 28px;border-left:2px solid var(--warm);background:linear-gradient(90deg,var(--warm-dim),transparent);max-width:640px;font-size:0.98rem;color:var(--text);font-weight:400;line-height:1.6;opacity:0;transform:translateY(16px);}

  #select{padding-top:70px;padding-bottom:40px;scroll-margin-top:90px;}
  .mode-grid{display:flex;gap:44px;padding:20px 0;max-width:1100px;flex-wrap:wrap;}
  .mode-card{transition:transform .5s cubic-bezier(.16,1,.3,1), border-color .35s, background-color .35s;}
  .mode-card:hover{transform:translateY(-4px);}
  .mode-card{flex:1;min-width:320px;background:var(--bg-panel);border:1px solid var(--border);border-radius:22px;padding:40px 36px;position:relative;overflow:hidden;cursor:pointer;}
  .mode-card:hover{border-color:var(--border);background:var(--bg-panel);}
  .mode-card .dir{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.1em;color:var(--signal);text-transform:uppercase;}
  .mode-card h3{color:var(--text-strong);font-family:var(--font-display);font-weight:600;font-size:1.7rem;margin-top:16px;letter-spacing:-0.01em;position:relative;display:inline-block;}
  .mode-card h3::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:2px;background:var(--signal);transition:width .35s ease;}
  .mode-card:hover h3::after{width:100%;}
  .mode-card p{color:var(--text-muted);font-size:0.95rem;margin-top:14px;line-height:1.55;max-width:32ch;}
  .mode-art{width:100%;height:140px;margin-top:28px;opacity:0.85;transition:opacity 1.1s cubic-bezier(.16,1,.3,1);}
  .mode-card:hover .mode-art{opacity:1;}
  .mode-art .svg-frame{stroke:var(--text-muted);opacity:0.5;}
  .mode-art .svg-text{fill:var(--text);}
  .mode-art .svg-signal{stroke:var(--signal);}
  .mode-art .svg-signal-fill{fill:var(--signal);}
  .mode-art .svg-warm{stroke:var(--warm);}
  .mode-art .svg-label{fill:var(--signal);}

  .select-lang{margin-top:30px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .select-lang-label{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);}

  /* ---------- Language popup (shown when a translation option is chosen) ---------- */
  .lang-modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;background:rgba(var(--bg-rgb),0.72);backdrop-filter:blur(6px);}
  .lang-modal[hidden]{display:none !important;}
  .lang-modal-box{width:min(440px,100%);background:var(--bg-panel);border:1px solid var(--border);border-radius:22px;padding:36px 32px 28px;box-shadow:0 20px 60px var(--signal-dim);animation:lang-modal-in .3s cubic-bezier(.16,1,.3,1);}
  @keyframes lang-modal-in{from{opacity:0;transform:translateY(12px) scale(.98);} to{opacity:1;transform:none;}}
  .lang-modal-box .dir{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--signal);}
  .lang-modal-box h3{font-family:var(--font-display);font-weight:600;font-size:1.5rem;letter-spacing:-0.01em;margin-top:14px;}
  .lang-modal-box > p{color:var(--text-muted);font-size:0.92rem;line-height:1.55;margin-top:12px;}
  .lang-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px;}
  .lang-choice{font-family:var(--font-display);text-align:left;padding:18px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:border-color .3s, color .3s;}
  .lang-choice strong{display:block;font-size:1.25rem;font-weight:600;color:inherit;}
  .lang-choice span{display:block;font-family:var(--font-mono);font-size:0.64rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;}
  .lang-choice:hover, .lang-choice:focus-visible{border-color:var(--signal);color:var(--signal);}
  .lang-choice.is-current{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);}
  .lang-cancel{margin-top:22px;background:none;border:0;padding:8px 0;color:var(--text-muted);font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;}
  .lang-cancel:hover, .lang-cancel:focus-visible{color:var(--signal);}
  @media (max-width:480px){ .lang-choices{grid-template-columns:1fr;} .lang-modal-box{padding:28px 22px 22px;} }

  .select-footnote{margin-top:48px;font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted);letter-spacing:0.03em;max-width:60ch;line-height:1.6;}
  .launch-status{margin-top:16px;min-height:16px;font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.02em;color:var(--text-muted);}

  /* ---------- Emergency alerts ---------- */
  .alert-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--alert-text);border:1px solid var(--alert);background:var(--alert-dim);padding:5px 10px;border-radius:999px;margin-top:12px;}
  .alert-tag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 0 var(--alert-dim);animation:alert-pulse 1.6s ease-out infinite;}
  @keyframes alert-pulse{0%{box-shadow:0 0 0 0 var(--alert-dim);}100%{box-shadow:0 0 0 10px transparent;}}
  html[data-motion="reduced"] .alert-tag::before{animation:none;}
  .bento-card.is-alert{border-color:var(--alert);}
  .bento-card.is-alert .num{color:var(--alert-text);}

  /* ---------- Animated background scene (What's Next page) ---------- */
  .bg-scene{position:relative;overflow:hidden;isolation:isolate;}

  /* ---------- About view ---------- */
  #view-about{line-height:1.6;padding-bottom:40px;}
  .page-hero{padding-top:170px;padding-bottom:40px;max-width:1100px;}
  .page-hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,7vw,5.2rem);line-height:1.04;letter-spacing:-0.02em;max-width:18ch;}
  .page-hero h1 .accent{color:var(--signal);}
  .page-hero p.lead{color:var(--text-muted);font-weight:400;font-size:clamp(1.05rem,1.6vw,1.3rem);max-width:60ch;margin-top:26px;}

  .block{padding-top:110px;max-width:1100px;}
  .block h2{font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,4vw,3rem);letter-spacing:-0.01em;line-height:1.1;max-width:24ch;}
  .block .intro{color:var(--text-muted);font-weight:400;font-size:1.05rem;max-width:62ch;margin-top:18px;}
  .block p{color:var(--text-muted);font-weight:400;font-size:1rem;max-width:64ch;margin-top:16px;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:50px;}
  .stat-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:30px 26px;transition:border-color .3s, background-color .4s;}
  .stat-card:hover{border-color:var(--signal-dim);}
  .stat-card .num{font-family:var(--font-display);font-weight:700;font-size:2.6rem;color:var(--signal);line-height:1;}
  .stat-card .num.warm{color:var(--warm-text);}
  .stat-card .label{font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-top:12px;display:block;line-height:1.5;}
  .stat-card p{font-size:0.9rem;margin-top:14px;color:var(--text-muted);}
  .source-note{font-family:var(--font-mono);font-size:0.68rem;color:var(--text-muted);letter-spacing:0.03em;margin-top:18px;max-width:80ch;line-height:1.6;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:50px;}
  .card{background:var(--bg-panel);border:1px solid var(--border);border-radius:20px;padding:34px 30px;transition:border-color .3s, background-color .4s;}
  .card:hover{border-color:var(--signal-dim);}
  .card .dir{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.1em;color:var(--signal);text-transform:uppercase;}
  .card h3{color:var(--text-strong);font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin-top:14px;letter-spacing:-0.01em;}
  .card p{color:var(--text-muted);font-weight:400;font-size:0.97rem;margin-top:12px;}

  /* ---------- Staggered future cards (hover reveal) ---------- */
  .stagger-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:28px 16px;padding:20px 0;margin-top:50px;max-width:1100px;}
  .stagger-item{display:flex;flex-direction:column;gap:12px;min-width:0;height:100%;}
  .stagger-num{font-family:var(--font-mono);font-size:0.8rem;letter-spacing:0.12em;color:var(--signal);}
  .stagger-card{flex:1;display:flex;flex-direction:column;background:linear-gradient(135deg,var(--bg-panel-2),var(--bg-panel));border:1px solid var(--border);border-radius:20px;padding:34px 30px;color:var(--text);transition:border-color .3s ease;}
  .stagger-grid:hover .stagger-card:nth-child(1){transition-delay:0s;}
  .stagger-grid:hover .stagger-card:nth-child(2){transition-delay:0.1s;}
  .stagger-grid:hover .stagger-card:nth-child(3){transition-delay:0.2s;}
  .stagger-grid:hover .stagger-card:nth-child(4){transition-delay:0.3s;}
  .stagger-card .dir{margin-top:0;}
  .stagger-card h3{color:var(--text-strong);margin-top:14px;}
  .stagger-card p:not(.dir){margin-top:12px;}
  html[data-motion="reduced"] .stagger-card{transform:none !important;opacity:1 !important;}
  @media (max-width:800px){.stagger-grid{grid-template-columns:1fr;grid-auto-rows:auto;}}

  .steps{display:flex;flex-wrap:wrap;gap:0;margin-top:50px;}
  .step{flex:1;min-width:220px;padding:26px 24px;border-top:1px solid var(--border);}
  .step .n{font-family:var(--font-mono);font-size:0.7rem;color:var(--signal);letter-spacing:0.08em;}
  .step h3{color:var(--text-strong);font-family:var(--font-display);font-size:1.1rem;font-weight:600;margin-top:10px;}
  .step p{color:var(--text-muted);font-size:0.9rem;margin-top:8px;}

  .note{margin-top:50px;padding:24px 28px;border-left:2px solid var(--warm);background:linear-gradient(90deg,var(--warm-dim),transparent);max-width:720px;color:var(--text);font-weight:400;line-height:1.6;border-radius:0 12px 12px 0;}

  .team{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;margin-top:50px;align-items:center;}
  .member.featured{padding:44px 40px;border-color:var(--signal-dim);}
  .member{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:26px 24px;transition:border-color .3s, background-color .4s;}
  .member:hover{border-color:var(--signal-dim);}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--bg-panel-2);border:1px solid var(--border);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:var(--signal);font-size:1rem;}
  .photo-slot{width:100%;max-width:340px;aspect-ratio:1 / 1;border:1px dashed var(--border);border-radius:14px;background:var(--bg-panel-2);display:grid;place-items:center;text-align:center;overflow:hidden;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;line-height:1.6;color:var(--text-muted);text-transform:uppercase;}
  .photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-fallback{font-family:var(--font-display);font-size:1.6rem;font-weight:600;letter-spacing:.04em;color:var(--signal);}
  .member h3{color:var(--text-strong);font-family:var(--font-display);font-weight:600;font-size:1.1rem;margin-top:18px;}
  .team .member{text-align:center;}
  .team .photo-slot{margin-inline:auto;}
  .member .role{font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase;margin-top:6px;}

  .sources{margin-top:50px;max-width:900px;}
  .sources ol{padding-left:20px;color:var(--text-muted);font-size:0.9rem;display:flex;flex-direction:column;gap:10px;font-weight:400;}
  .sources li::marker{color:var(--signal);}

  /* ---------- Learn more: charts ---------- */
  .chart-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:18px;padding:30px 28px;margin-top:30px;transition:background-color .4s, border-color .3s;}
  .chart-card:hover{border-color:var(--signal-dim);}
  .chart-card h3{font-family:var(--font-display);font-weight:600;font-size:1.1rem;line-height:1.3;margin-bottom:24px;color:var(--text);}
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .bar-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 80px;gap:16px;align-items:center;margin-bottom:18px;}
  .bar-label{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.05em;color:var(--text-muted);text-transform:uppercase;line-height:1.4;}
  .bar-track{height:14px;background:var(--bg-panel-2);border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--signal-dim),var(--signal));transition:width 1.4s cubic-bezier(.16,1,.3,1);}
  .bar-fill.warm{background:linear-gradient(90deg,var(--warm-dim),var(--warm));}
  .bar-val{font-family:var(--font-display);font-weight:600;color:var(--text);text-align:right;}
  .donut-wrap{position:relative;width:200px;height:200px;margin:8px auto 0;}
  .donut-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .donut-track{stroke:var(--bg-panel-2);}
  .donut-arc{stroke:var(--signal);stroke-linecap:round;}
  .donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.8rem;color:var(--text);}
  .donut-center small{display:block;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);font-weight:400;margin-top:4px;}
  .empty-note{font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);line-height:1.6;max-width:60ch;}
  .anim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px;}
  .anim-slot{aspect-ratio:4/3;border:1px dashed var(--border);border-radius:18px;display:grid;place-items:center;text-align:center;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.06em;line-height:1.6;color:var(--text-muted);text-transform:uppercase;background:var(--bg-panel);}
  @media (max-width:800px){.chart-row,.anim-grid{grid-template-columns:1fr;} .bar-row{grid-template-columns:1fr 60px;} .bar-label{grid-column:1 / -1;} .bar-val{grid-column:2;grid-row:2;}}

  /* ---------- Footer (shared) ---------- */
  .site-footer{margin-top:60px;border-top:1px solid var(--border);background:var(--bg-panel);padding:72px 6vw 0;transition:background-color .4s;}
  .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:48px;max-width:1200px;align-items:start;}
  .footer-brand .nav-logo{margin-bottom:18px;}
  .footer-brand p{color:var(--text-muted);font-weight:400;font-size:0.95rem;line-height:1.6;max-width:36ch;}
  .footer-col h4{font-family:var(--font-mono);font-weight:500;font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--signal);margin-bottom:18px;}
  .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:12px;}
  .footer-col li{color:var(--text-muted);font-size:0.9rem;line-height:1.5;}
  .footer-col a{text-decoration:none;color:var(--text-muted);transition:color .3s;}
  .footer-col a:hover{color:var(--signal);}
  .footer-bottom{max-width:1200px;margin:56px auto 0;padding:24px 0 32px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);letter-spacing:0.04em;}

  /* ---------- Card hover and tap (all cards) ---------- */
  .card, .member, .chart-card, .stat-card, .anim-slot{
    transition:scale .35s cubic-bezier(.16,1,.3,1), border-color .35s, background-color .35s;
  }
  .card:hover, .member:hover, .chart-card:hover, .stat-card:hover, .anim-slot:hover{
    scale:1.03;border-color:var(--signal);
  }
  .card:active, .member:active, .chart-card:active, .stat-card:active, .anim-slot:active{
    scale:0.97;
  }
  html[data-motion="reduced"] .card:hover, html[data-motion="reduced"] .member:hover,
  html[data-motion="reduced"] .chart-card:hover, html[data-motion="reduced"] .stat-card:hover{scale:none;}

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .stats{grid-template-columns:1fr;}
    .team{grid-template-columns:1fr;justify-items:center;}
    .member{width:100%;max-width:440px;}
    .member.featured{padding:26px 24px;order:-1;}
  }
  @media (max-width:800px){
    .bento{grid-template-columns:repeat(2,1fr);}
    .bento-card:nth-child(5){grid-column:span 2;}
    .cards{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;gap:36px;}
    .footer-brand{grid-column:1 / -1;}
  }
  @media (max-width:600px){
    nav{padding:18px 5vw;}
    .nav-link{display:none;}
    .menu-btn{display:grid;}
    .theme-toggle{padding:5px;}
    .team{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr;}
    .photo-slot{max-width:240px;}
  }
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }

  /* ---------- Responsive fixes ---------- */
  img, svg{max-width:100%;}
  .mode-card{min-width:0;flex:1 1 320px;}
  .mode-grid{gap:24px;}

  @media (max-width:1024px){
    .nav-right{gap:8px;}
    .nav-link{padding:8px 12px;}
    .lang-option{padding:6px 9px;}
  }
  @media (max-width:900px){
    nav{flex-wrap:wrap;gap:12px;}
    .nav-right{flex-wrap:wrap;justify-content:flex-end;}
    #hero{padding-top:150px;}
    .page-hero{padding-top:150px;}
    .bento{max-width:100%;}
  }
  @media (max-width:600px){
    section{padding:0 5vw;}
    #hero{padding-top:140px;}
    .page-hero{padding-top:140px;}
    .block{padding-top:80px;}
    .mode-card{padding:28px 22px;}
    .card, .stagger-card{padding:26px 22px;}
    .bento{grid-template-columns:1fr 1fr;}
    .bento-card:nth-child(5){grid-column:span 2;}
    .hero-cta .glow-btn{width:100%;}
  }
  @media (max-width:360px){
    .mode-card{padding:22px 18px;}
    .bento{grid-template-columns:1fr;}
    .bento-card:nth-child(5){grid-column:span 1;}
  }

  /* ---------- Dictionary ---------- */
  /* No width cap on the dictionary: the grid keeps adding columns as the window (or zoom-out level) grows */
  #asl-dictionary{max-width:none;}
  /* Sign cards fill the row with as many columns as fit at 260px or wider */
  .dict-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));grid-auto-rows:1fr;gap:16px;margin-top:50px;}
  .dict-card{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .dict-art{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px;}
  .dict-visuals{aspect-ratio:4 / 3;max-height:240px;display:flex;justify-content:center;align-items:center;gap:10px;}
  .dict-visuals svg{width:50%;height:auto;max-width:100%;max-height:100%;display:block;}
  .dict-visuals[data-count="1"] svg{width:80%;}
  /* Two-hand signs draw both hands in one wide SVG, so it needs most of the panel */
  .dict-visuals svg[viewBox="0 0 260 130"]{width:100%;}
  .dict-visuals svg[viewBox="0 0 140 215"]{width:64%;}
  .dict-text{flex:1;}
  .dict-card h3{margin-top:6px;}
  .dict-card p:not(.dir){margin-top:8px;font-size:0.92rem;}
</style>
